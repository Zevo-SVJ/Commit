# Publishes the prototype so it can be opened on a real phone, in a real
# browser, with real browser chrome — the only way the viewport and gesture
# work in this prototype can actually be judged.
#
# Builds on every push to this branch and force-pushes the result to the
# `gh-pages` branch. Point Settings -> Pages at that branch once and the site
# stays current on its own.
name: Deploy prototype

on:
  push:
    branches: [claude/commit-decision-prototype-cqx9rf]
  workflow_dispatch:

permissions:
  contents: write

# Never let two deploys race; always finish the newest one.
concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Publish dist/ to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Pages would otherwise run the output through Jekyll.
          touch dist/.nojekyll
          cd dist
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build ${GITHUB_SHA}"
          git push -f \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:gh-pages
