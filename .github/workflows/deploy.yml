# Publishes the prototype to GitHub Pages so it can be opened on a real phone,
# in a real browser, with real browser chrome — which is the only way the
# viewport and gesture work in this prototype can actually be judged.
name: Deploy prototype

on:
  push:
    branches: [claude/commit-decision-prototype-cqx9rf]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; always finish the newest one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # enablement: true turns Pages on the first time this runs, so the
      # repository needs no manual setup.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
